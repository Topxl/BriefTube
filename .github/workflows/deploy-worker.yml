name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "vps/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: "089a5c93-5c51-4a24-8bf0-9d8bceb3a114"
          env-slug: "prod"
          secret-path: "/deploy"
          export-type: "env"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: 138.199.220.195
          username: brieftube
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/brieftube/app

            echo "→ Pulling latest code..."
            git pull origin main

            echo "→ Updating dependencies..."
            worker/venv/bin/pip install -r worker/requirements.txt -q

            echo "→ Restarting services..."
            sudo systemctl daemon-reload
            sudo systemctl restart brieftube-worker
            sudo systemctl restart brieftube-log-bot
            sleep 2

            echo "→ Status:"
            sudo systemctl status brieftube-worker --no-pager
            sudo systemctl status brieftube-log-bot --no-pager

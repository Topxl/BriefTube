name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "vps/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: "brieftube-server-qy7-v"
          env-slug: "prod"
          secret-path: "/deploy"
          export-type: "env"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: brieftube
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/brieftube/app

            echo "→ Pulling latest code..."
            # Discard any local changes (e.g. from manual SSH deploys) so git pull never blocks.
            # Runtime-generated files (worker.pid, log_bot.lock) are gitignored so reset is safe.
            git fetch origin main
            git reset --hard origin/main

            echo "→ Updating dependencies..."
            worker/venv/bin/pip install -r worker/requirements.txt -q
            worker/venv/bin/pip install -U yt-dlp -q

            echo "→ Restarting services..."
            chmod +x vps/*.sh 2>/dev/null || true
            # daemon-reload is intentionally omitted: unit files (*.service)
            # change very rarely and are applied manually over SSH with full
            # sudo. The hardened /etc/sudoers.d/brieftube only whitelists
            # start/stop/restart/status for the 3 units — no daemon-reload.
            sudo systemctl restart brieftube-worker
            sudo systemctl restart brieftube-log-bot
            sleep 2

            echo "→ Status:"
            # --no-pager intentionally dropped: the hardened sudoers whitelist
            # requires an exact argv match (no trailing args), and stdout is
            # already non-TTY in CI so systemd doesn't invoke a pager anyway.
            sudo systemctl status brieftube-worker || true
            sudo systemctl status brieftube-log-bot || true

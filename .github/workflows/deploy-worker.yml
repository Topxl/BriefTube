name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "vps/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Debug Infisical API
        run: |
          echo "--- Testing Universal Auth login ---"
          AUTH=$(curl -s -o /tmp/auth.json -w "%{http_code}" -X POST \
            "https://app.infisical.com/api/v1/auth/universal-auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\": \"$INFISICAL_CLIENT_ID\", \"clientSecret\": \"$INFISICAL_CLIENT_SECRET\"}")
          echo "Auth HTTP status: $AUTH"
          if [ "$AUTH" = "200" ]; then
            TOKEN=$(cat /tmp/auth.json | python3 -c "import sys,json; print(json.load(sys.stdin)['accessToken'])")
            echo "Login OK — identifying machine identity..."
            curl -s "https://app.infisical.com/api/v1/auth/token/me" \
              -H "Authorization: Bearer $TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Identity ID:', d.get('identityId', d))" 2>/dev/null || true
          else
            echo "Login FAILED:"
            cat /tmp/auth.json
          fi
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: "brieftube-server"
          env-slug: "prod"
          secret-path: "/deploy"
          export-type: "env"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: brieftube
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/brieftube/app

            echo "→ Pulling latest code..."
            git pull origin main

            echo "→ Updating dependencies..."
            worker/venv/bin/pip install -r worker/requirements.txt -q

            echo "→ Restarting services..."
            sudo systemctl daemon-reload
            sudo systemctl restart brieftube-worker
            sudo systemctl restart brieftube-log-bot
            sleep 2

            echo "→ Status:"
            sudo systemctl status brieftube-worker --no-pager
            sudo systemctl status brieftube-log-bot --no-pager

name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "vps/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: "brieftube-server-qy7-v"
          env-slug: "prod"
          secret-path: "/deploy"
          export-type: "env"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.VPS_HOST }}
          username: brieftube
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/brieftube/app

            echo "→ Pulling latest code..."
            # Remove runtime files that are now gitignored (worker.pid, log_bot.lock)
            # to prevent git from blocking the merge when they exist as untracked files
            git clean -f -- worker/worker.pid worker/log_bot.lock 2>/dev/null || true
            git pull origin main

            echo "→ Updating dependencies..."
            worker/venv/bin/pip install -r worker/requirements.txt -q

            echo "→ Restarting services..."
            chmod +x vps/*.sh 2>/dev/null || true
            sudo systemctl daemon-reload
            sudo systemctl restart brieftube-worker
            sudo systemctl restart brieftube-log-bot
            sleep 2

            echo "→ Status:"
            sudo systemctl status brieftube-worker --no-pager || true
            sudo systemctl status brieftube-log-bot --no-pager || true

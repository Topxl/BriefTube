name: Deploy Worker (Modal)

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "vps/**"
  workflow_dispatch:

jobs:
  deploy-modal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: pip install modal

      - name: Deploy Modal function
        run: modal deploy worker/modal_processor.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

      # Pi auto-updates via cron (polls GitHub every 5 min)
      # No SSH needed — see vps/update-pi.sh
